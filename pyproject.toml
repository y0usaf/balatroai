[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "balatroai"
version = "0.1.0"
description = "Bots for Balatro, driven through the balatrobot JSON-RPC API"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# jackdaw = validated 1:1 Balatro simulator (live-parity branch: our 11
# divergence fixes vs Balatro 1.0.1o + smods), vendored at
# vendor/jackdaw.  Core stays stdlib-only; the sim backend is opt-in:
# `uv sync --extra sim`.
sim = ["jackdaw"]
# train = RL training stack (torch, sb3-contrib) via the vendored
# jackdaw's train extra.
train = ["jackdaw[train]"]

[tool.uv.sources]
# Vendored at vendor/jackdaw (fork github.com/y0usaf/jackdaw-balatro, branch
# live-parity, commit b3730688f342039fc767776e536cdb294d6c5ac4; see
# vendor/jackdaw/PROVENANCE.md). No private remote access required.
jackdaw = { path = "vendor/jackdaw" }

[project.scripts]
balatroai = "balatroai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/balatroai"]
